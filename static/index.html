<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hy2 多端口分流面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e2e8f0; min-height: 100vh; }
  .login-box { max-width: 360px; margin: 14vh auto; background: #1a2233; padding: 32px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .login-box h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  input, select { width: 100%; padding: 9px 12px; background: #0f1420; border: 1px solid #2d3a52; border-radius: 6px; color: #e2e8f0; font-size: 14px; margin-bottom: 12px; }
  input:focus, select:focus { outline: none; border-color: #4f7cff; }
  button { cursor: pointer; border: none; border-radius: 6px; font-size: 14px; padding: 9px 16px; }
  .btn-primary { background: #4f7cff; color: #fff; width: 100%; }
  .btn-primary:hover { background: #3d6af0; }
  .btn-sm { background: #2d3a52; color: #cbd5e1; padding: 5px 10px; font-size: 12px; }
  .btn-sm:hover { background: #3a4a68; }
  .btn-danger { background: #7f2d2d; color: #fca5a5; padding: 5px 10px; font-size: 12px; }
  .btn-danger:hover { background: #9b3535; }
  #app { display: none; padding: 24px; max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  header h1 { font-size: 18px; }
  .card { background: #1a2233; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin-bottom: 14px; color: #93b4ff; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 130px; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2d3a52; }
  th { color: #94a3b8; font-weight: 500; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #2d3a52; }
  .link-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #2d3a52; font-size: 12px; word-break: break-all; }
  .link-row code { color: #7ee2a8; flex: 1; }
  .msg { padding: 10px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; display: none; }
  .msg.err { background: #3d1f1f; color: #fca5a5; display: block; }
  .msg.ok { background: #1f3d29; color: #86efac; display: block; }
  .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
</style>
</head>
<body>
<div class="login-box" id="loginBox">
  <h1>🔐 hy2 多端口分流面板</h1>
  <div class="msg" id="loginMsg"></div>
  <input id="loginUser" placeholder="用户名" autocomplete="username">
  <input id="loginPass" placeholder="密码" type="password" autocomplete="current-password">
  <button class="btn-primary" onclick="doLogin()">登 录</button>
  <p class="hint">默认账号 admin / admin123</p>
</div>

<div id="app">
  <header>
    <h1>hy2 多端口分流面板</h1>
    <div>
      <span id="whoami" style="margin-right:12px;font-size:13px;color:#94a3b8"></span>
      <button class="btn-sm" onclick="showChangePwd()">改密码</button>
      <button class="btn-sm" onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="msg" id="msg"></div>

  <div class="card">
    <h2>➕ 新建规则（hy2 入站端口 → 出口代理）</h2>
    <div class="row">
      <div><label>备注名称</label><input id="fName" placeholder="如：美国线路"></div>
      <div><label>入站端口</label><input id="fPort" placeholder="如 8443" type="number"></div>
      <div><label>hy2 密码</label><input id="fPwd" placeholder="入站连接密码"></div>
      <div><label>混淆 (obfs)</label><select id="fObfs"><option value="">关闭</option><option value="1">开启 (salamander)</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label>出口类型</label><select id="fOutType" onchange="toggleOutFields()">
        <option value="direct">direct（本机 IP 直连）</option>
        <option value="socks">socks5 代理</option>
        <option value="http">http 代理</option>
        <option value="hy2">hy2 代理</option>
      </select></div>
      <div class="outField" style="display:none"><label>出口服务器</label><input id="fOutServer" placeholder="代理服务器 IP/域名"></div>
      <div class="outField" style="display:none"><label>出口端口</label><input id="fOutPort" placeholder="代理端口" type="number"></div>
      <div class="outField" style="display:none"><label>出口认证用户名（可选）</label><input id="fOutUser"></div>
      <div class="outField" style="display:none"><label>出口认证密码（可选）</label><input id="fOutPwd"></div>
    </div>
    <div style="margin-top:14px"><button class="btn-primary" style="width:auto" onclick="addRule()">添加规则</button></div>
  </div>

  <div class="card">
    <h2>📋 规则列表</h2>
    <table>
      <thead><tr><th>名称</th><th>入站端口</th><th>出口</th><th>混淆</th><th>操作</th></tr></thead>
      <tbody id="rulesBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>🔗 生成配置与客户端链接</h2>
    <p class="hint" style="margin-bottom:10px">点击生成 → 下载 config.json（服务器 sing-box 用）+ 每条规则的 hy2:// 客户端链接。</p>
    <button class="btn-primary" style="width:auto" onclick="genConfig()">⚡ 生成配置</button>
    <div id="linksArea" style="margin-top:14px"></div>
    <div id="cfgArea" style="margin-top:10px"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(path, body, method) {
  const r = await fetch(path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: {'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin'
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { $('loginBox').style.display = 'block'; $('app').style.display = 'none'; }
  return { status: r.status, data: d };
}
function msg(text, ok) {
  const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err');
  setTimeout(() => { m.className = 'msg'; }, 4000);
}

async function doLogin() {
  const { data } = await api('/api/login', { username: $('loginUser').value, password: $('loginPass').value });
  if (data.ok) location.reload();
  else { const m = $('loginMsg'); m.textContent = data.error || '登录失败'; m.className = 'msg err'; }
}
async function doLogout() { await api('/api/logout', {}); location.reload(); }

async function showChangePwd() {
  const old = prompt('旧密码：'); if (!old) return;
  const nw = prompt('新密码（至少6位）：'); if (!nw) return;
  const { data } = await api('/api/change_password', { old, new: nw });
  msg(data.ok ? '密码已修改' : (data.error || '失败'), data.ok);
}

function toggleOutFields() {
  const show = $('fOutType').value !== 'direct';
  document.querySelectorAll('.outField').forEach(e => e.style.display = show ? '' : 'none');
}

async function loadRules() {
  const { data } = await api('/api/rules');
  const tb = $('rulesBody'); tb.innerHTML = '';
  for (const r of data.rules || []) {
    const out = r.out_type === 'direct' ? 'direct（本机出口）' : `${r.out_type} → ${r.out_server}:${r.out_port}`;
    tb.insertAdjacentHTML('beforeend', `<tr>
      <td>${r.name || '-'}</td><td>${r.listen_port}</td>
      <td><span class="tag">${out}</span></td>
      <td>${r.obfs ? '✅' : '—'}</td>
      <td><button class="btn-danger" onclick="delRule('${r.id}')">删除</button></td>
    </tr>`);
  }
}

async function addRule() {
  const rule = {
    name: $('fName').value,
    listen_port: parseInt($('fPort').value),
    password: $('fPwd').value,
    obfs: $('fObfs').value === '1',
    out_type: $('fOutType').value,
    out_server: $('fOutServer').value,
    out_port: $('fOutPort').value,
    out_username: $('fOutUser').value,
    out_password: $('fOutPwd').value
  };
  const { data } = await api('/api/rules', rule);
  if (data.ok) { msg('规则已添加', true); loadRules(); }
  else msg(data.error || '添加失败', false);
}

async function delRule(id) {
  if (!confirm('确定删除这条规则？')) return;
  await api(`/api/rules/${id}/delete`, {});
  loadRules();
}

async function genConfig() {
  const { data } = await api('/api/generate', {});
  if (!data.ok) { msg('生成失败', false); return; }
  msg('配置已生成', true);
  const area = $('linksArea'); area.innerHTML = '<h2 style="font-size:13px;color:#93b4ff;margin-bottom:8px">客户端链接（按端口对应不同出口）</h2>';
  for (const l of data.links) {
    area.insertAdjacentHTML('beforeend', `<div class="link-row"><span class="tag">${l.name} :${l.port}</span><code>${l.url}</code><button class="btn-sm" onclick="navigator.clipboard.writeText('${l.url}');this.textContent='已复制'">复制</button></div>`);
  }
  $('cfgArea').innerHTML = `<button class="btn-sm" onclick='downloadCfg()'>⬇ 下载 config.json</button><span class="hint"> 部署时上传到服务器 /etc/hy2/config.json</span>`;
  window._cfg = data.config;
}
function downloadCfg() {
  const blob = new Blob([JSON.stringify(window._cfg, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'config.json'; a.click();
}

(async () => {
  const { data } = await api('/api/me');
  if (data.user) {
    $('loginBox').style.display = 'none';
    $('app').style.display = 'block';
    $('whoami').textContent = '👤 ' + data.user;
    loadRules();
  }
})();
</script>
</body>
</html>
